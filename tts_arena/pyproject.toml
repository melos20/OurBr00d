[project]
name = "tts-benchmark"
version = "0.1.0"
description = "Standalone TTS benchmark and evaluation tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
  "gradio>=4.0.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.6.0",
  "soundfile>=0.12.1",
  "numpy>=1.24.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.0",
  "kokoro>=0.1.0",
  "torch>=2.2.0",
  "torchaudio>=2.2.0",
  "onnxruntime>=1.17.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
qwen = [
  "qwen-tts>=0.1.0"
]

[project.scripts]
tts-benchmark = "tts_benchmark.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
